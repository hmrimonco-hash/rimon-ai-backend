<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rimon AI</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; }
  #log { flex: 1; overflow-y: auto; padding: 12px; }
  .msg { margin: 8px 0; padding: 10px 12px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; }
  .me { background: #2a4d8f; margin-left: auto; }
  .ai { background: #262626; }
  .tag { font-size: 11px; opacity: .6; display: block; margin-bottom: 4px; }
  #bar { display: flex; gap: 8px; padding: 10px; background: #1a1a1a; }
  #q { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 0; font-size: 16px; }
  button { padding: 12px 14px; border: 0; border-radius: 10px; font-size: 16px; }
</style>
</head>
<body>
<div id="log"></div>
<div id="bar">
  <button id="mic">Mic</button>
  <input id="q" placeholder="Likhun ba Mic chapun">
  <button id="send">Send</button>
</div>
<script>
const log = document.getElementById('log');
const q = document.getElementById('q');
let token = '';
try { token = localStorage.getItem('rimon_token') || ''; } catch (e) {}

function add(text, cls, tag) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  if (tag) {
    const t = document.createElement('span');
    t.className = 'tag';
    t.textContent = tag;
    d.appendChild(t);
  }
  d.appendChild(document.createTextNode(text));
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

async function send() {
  const text = q.value.trim();
  if (!text) return;
  if (!token) {
    token = prompt('Password:') || '';
    if (!token) return;
    try { localStorage.setItem('rimon_token', token); } catch (e) {}
  }
  q.value = '';
  add(text, 'me');
  const wait = add('...', 'ai');
  try {
    const r = await fetch('/chat?t=' + encodeURIComponent(token) + '&q=' + encodeURIComponent(text));
    const data = await r.json();
    if (r.status === 403) {
      token = '';
      try { localStorage.removeItem('rimon_token'); } catch (e) {}
    }
    wait.remove();
    if (data.answer) add(data.answer, 'ai', data.module);
    else add('Error: ' + (data.error || 'unknown') + (data.detail ? ' - ' + data.detail : ''), 'ai');
  } catch (e) {
    wait.remove();
    add('Network error. Abar chesta korun.', 'ai');
  }
}

document.getElementById('send').onclick = send;
q.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = document.getElementById('mic');
if (!SR) {
  mic.disabled = true;
  mic.textContent = 'No mic';
} else {
  const rec = new SR();
  rec.lang = 'bn-BD';
  rec.interimResults = false;
  rec.onresult = function (e) { q.value = e.results[0][0].transcript; };
  rec.onerror = function (e) { add('Mic error: ' + e.error, 'ai'); };
  rec.onend = function () { mic.textContent = 'Mic'; };
  mic.onclick = function () { mic.textContent = 'Shunchi...'; rec.start(); };
}
</script>
</body>
</html>
